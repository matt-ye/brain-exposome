name: Monthly data-freshness check

# Detects new upstream data, notifies the owner, and leaves a review reminder.
# - API sources (World Bank, WHO GHO) are checked live against scripts/data-versions.json
# - Manual sources (NCD-RisC / GBD / ACAG / papers) are listed for a human glance
# The result is filed as a GitHub Issue that @mentions the owner (→ email/notification).
# "Extract + register" then happens in a follow-up PR (see the issue body + the doc).

on:
  schedule:
    - cron: '0 6 1 * *'      # 06:00 UTC on the 1st of every month
  workflow_dispatch: {}       # allow a manual run any time

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check upstream data freshness
        id: check
        run: python scripts/check_data_freshness.py --out report.md

      - name: Scan the literature for new candidates
        # Provider keys are optional — if unset, --triage is a no-op and every
        # candidate is kept (keyless). Add them as repo secrets to enable the
        # NIM → Groq → Cloudflare relevance filter (see scripts/.env.example).
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # Optional pins. Normally UNSET: each tier then asks its provider
          # for a live model id (model ids get retired without notice — Groq
          # dropped every Llama in 2026-08). Repo *variables*, not secrets:
          # a model id is config, and it should be visible in the UI.
          NIM_MODEL: ${{ vars.NIM_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          CF_AI_MODEL: ${{ vars.CF_AI_MODEL }}
          # Earlier issues are the record of what was already reported: the radar
          # reads them back and skips those papers (the 45-day window overlaps the
          # monthly run). Read-only use of the token; issues: write already covers it.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional contact for the Europe PMC User-Agent (repo variable). Unset →
          # the UA carries the repo URL instead of a personal address.
          LITWATCH_CONTACT: ${{ vars.LITWATCH_CONTACT }}
        run: python scripts/literature_watch.py --out report.md --append --triage --seen-from-issues data-refresh

      - name: File / notify via a GitHub issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create data-refresh --color 1d76db --description "Monthly upstream data check" 2>/dev/null || true
          month="$(date -u +%Y-%m)"
          if [ "${{ steps.check.outputs.has_updates }}" = "true" ]; then
            title="🔔 Data refresh — ${{ steps.check.outputs.n_updates }} update(s) — ${month}"
          else
            title="✅ Data refresh — ${month} (no API changes; skim manual sources)"
          fi
          gh issue create --title "$title" --label data-refresh --body-file report.md
